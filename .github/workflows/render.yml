name: Fast Parallel Manim Render Farm

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render_scenes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scene:
          - { name: "Variation_1_KineticTypography", class: "KineticTypographyHookScene" }
          - { name: "Variation_2_GeometricScenes", class: "PoliceStandoffGeometricScene" }
          - { name: "Variation_3_TacticalHUD", class: "Variation3TacticalHUDAndSWATRadar" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Fast, No LaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Render ${{ matrix.scene.name }} (Full HD 1080p)
        run: |
          manim -qh main.py ${{ matrix.scene.class }} --format mp4 -o "${{ matrix.scene.name }}.mp4"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scene.name }}_1080p
          path: media/videos/**/${{ matrix.scene.name }}.mp4
          retention-days: 7
